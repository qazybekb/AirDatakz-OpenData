# Independent health check for the AirData pipeline, running on GitHub (not on the Mac).
# Fails — and GitHub emails the maintainer — only when something needs a human:
# no new data for 48 h, a city losing more than half of its reporting stations,
# or airdata.kz down / showing data older than 3 days.
name: Data freshness

on:
  schedule:
    - cron: "17 6 * * *"  # daily, 06:17 UTC (after the nightly publish)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open data updated in the last 48 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/commits?path=almaty&per_page=1" --jq '.[0].commit.committer.date')
          hours=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 3600 ))
          echo "Last Almaty data commit: $last (${hours} h ago)"
          if [ "$hours" -gt 48 ]; then
            echo "::error::No new data for ${hours} hours. Check the AirData Mac mini: ./airdata status"
            exit 1
          fi

      - name: Every city still reports from most of its usual stations
        run: |
          python3 - <<'PY'
          import csv, gzip, io, statistics, sys, urllib.request
          from datetime import date
          repo, failed = "${{ github.repository }}", False
          for city in ("almaty", "astana", "karaganda"):
              url = f"https://raw.githubusercontent.com/{repo}/main/{city}/daily/pm25.csv.gz"
              with urllib.request.urlopen(url, timeout=60) as resp:
                  rows = list(csv.DictReader(io.TextIOWrapper(gzip.GzipFile(fileobj=io.BytesIO(resp.read())))))
              latest = date.fromisoformat(rows[-1]["date"])
              complete, history = rows[-2], rows[-16:-2]   # the latest day may still be filling up
              usual = statistics.median(float(r["n_stations"]) for r in history)
              now = float(complete["n_stations"])
              print(f"{city}: latest {latest}, stations on {complete['date']}: {now:.0f} (usual {usual:.0f})")
              if (date.today() - latest).days > 3:
                  print(f"::error::{city}: newest daily value is {latest}"); failed = True
              if usual and now < 0.5 * usual:
                  print(f"::error::{city}: only {now:.0f} stations reported on {complete['date']} (usual {usual:.0f})"); failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: airdata.kz is up and shows recent data
        run: |
          curl -fsS --max-time 30 https://airdata.kz/ -o /dev/null
          curl -fsS --max-time 30 "https://airdata.kz/data/calendar.json?t=$(date +%s)" -o calendar.json
          python3 - <<'PY'
          import json, sys
          from datetime import date
          cal = json.load(open("calendar.json"))
          latest = max(date(int(y), int(d[:2]), int(d[3:]))
                       for years in cal.values() for y, v in years.items() for d in v["days"])
          age = (date.today() - latest).days
          print(f"Latest day on airdata.kz: {latest} ({age} days ago)")
          if age > 3:
              print(f"::error::airdata.kz shows data that is {age} days old")
              sys.exit(1)
          PY
