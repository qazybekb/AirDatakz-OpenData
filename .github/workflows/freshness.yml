# Independent health check for the AirData pipeline, running on GitHub (not on the Mac).
# Fails — and GitHub emails the maintainer — only when something needs a human:
# no new data for 48 h (in any of a city's main parameters), a city losing more than half of its reporting stations,
# a source in a city losing more than half of its usual stations, or airdata.kz
# down / showing data older than 3 days.
name: Data freshness

on:
  schedule:
    - cron: "17 6 * * *"  # daily, 06:17 UTC (after the nightly publish)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open data updated in the last 48 hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/commits?path=almaty&per_page=1" --jq '.[0].commit.committer.date')
          hours=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 3600 ))
          echo "Last Almaty data commit: $last (${hours} h ago)"
          if [ "$hours" -gt 48 ]; then
            echo "::error::No new data for ${hours} hours. Check the AirData Mac mini: ./airdata status"
            exit 1
          fi

      - name: Every city still reports from most of its usual stations
        run: |
          python3 - <<'PY'
          import csv, gzip, io, statistics, sys, urllib.error, urllib.request
          from datetime import date, timedelta

          repo, failed = "${{ github.repository }}", False

          for city in ("almaty", "astana", "karaganda"):
              # Newest local daily value and city-wide station coverage. Checked on PM2.5 when the city has clean
              # PM2.5, else on the first parameter that is current: a city whose dust channels are all flagged
              # by the quality control (Karaganda since 10 Oct 2026) is a data state, not a pipeline outage.
              parameter = by_day = latest = None
              newest = {}
              for candidate in ("pm25", "pm10", "co", "so2", "no2"):
                  url = f"https://raw.githubusercontent.com/{repo}/main/{city}/daily/{candidate}.csv.gz"
                  try:
                      with urllib.request.urlopen(url, timeout=60) as resp:
                          rows = list(csv.DictReader(io.TextIOWrapper(gzip.GzipFile(fileobj=io.BytesIO(resp.read())))))
                  except urllib.error.HTTPError:
                      continue
                  days = {date.fromisoformat(r["date"]): float(r["n_stations"]) for r in rows}
                  if not days:
                      continue
                  newest[candidate] = max(days)
                  if (date.today() - max(days)).days <= 3:
                      parameter, by_day, latest = candidate, days, max(days)
                      break

              if parameter is None:
                  shown = ", ".join(f"{p} {d}" for p, d in newest.items())
                  print(f"::error::{city}: no parameter has a daily value newer than 3 days ({shown})")
                  failed = True
                  continue

              print(f"{city}: newest daily value {latest} ({parameter})")
              if parameter != "pm25":
                  print(f"::warning::{city}: no clean PM2.5 since {newest.get('pm25')}; freshness and coverage checked on {parameter}")

              # Coverage: the last complete day vs the two calendar weeks before it.
              # Skipped right after an outage/restart, when there is no recent history yet.
              complete = latest - timedelta(days=1)
              history = [n for d, n in by_day.items() if complete - timedelta(days=15) <= d < complete]

              if complete not in by_day or len(history) < 5:
                  print("  coverage check skipped (not enough recent history)")
                  continue

              usual, now = statistics.median(history), by_day[complete]
              print(f"  stations on {complete}: {now:.0f} (usual {usual:.0f})")

              if now < 0.5 * usual:
                  print(f"::error::{city}: only {now:.0f} stations reported on {complete} (usual {usual:.0f})")
                  failed = True

              # Source-level coverage from the hourly file.
              # The hourly file is read once per city and used for all sources.
              hourly_url = f"https://raw.githubusercontent.com/{repo}/main/{city}/{parameter}.csv.gz"
              day_hours = {}
              day_source_stations = {}

              with urllib.request.urlopen(hourly_url, timeout=60) as resp:
                  reader = csv.DictReader(io.TextIOWrapper(gzip.GzipFile(fileobj=resp), encoding="utf-8"))
                  for row in reader:
                      try:
                          d = date.fromisoformat(row["datetime_utc"][:10])
                      except (ValueError, KeyError):
                          continue

                      hour = row.get("datetime_utc")
                      station_id = row.get("station_id")
                      source = row.get("source")

                      if hour:
                          day_hours.setdefault(d, set()).add(hour)

                      if station_id and source:
                          day_source_stations.setdefault(d, {}).setdefault(source, set()).add(station_id)

              if not day_source_stations:
                  print("  source coverage check skipped (no hourly station rows)")
                  continue

              # Latest complete UTC day in the hourly file.
              # A complete day is preferred to have at least 24 distinct hour stamps.
              # If no such day is present, fall back to the day before the newest day,
              # mirroring the existing daily-summary behaviour for a partial newest day.
              complete_days = [d for d, hours in day_hours.items() if len(hours) >= 24]
              if complete_days:
                  complete_utc = max(complete_days)
              else:
                  newest = max(day_source_stations)
                  complete_utc = newest - timedelta(days=1)

              if complete_utc not in day_source_stations:
                  print("  source coverage check skipped (no complete UTC day)")
                  continue

              # Compare each source on the latest complete UTC day with the median of the 14 days before.
              window_start = complete_utc - timedelta(days=14)
              window_days = [window_start + timedelta(days=i) for i in range(14)]

              sources = set(day_source_stations.get(complete_utc, {}))
              for d in window_days:
                  sources.update(day_source_stations.get(d, {}))

              for source in sorted(sources):
                  history = [
                      len(day_source_stations.get(d, {}).get(source, ()))
                      for d in window_days
                  ]

                  # Keep the existing "not enough recent history" style: require some
                  # non-zero recent days before judging a source as broken.
                  if sum(1 for n in history if n > 0) < 5:
                      print(f"  source {source}: coverage check skipped (not enough recent history)")
                      continue

                  usual = statistics.median(history)
                  now = len(day_source_stations.get(complete_utc, {}).get(source, ()))

                  print(f"  source {source}: stations on {complete_utc}: {now} (usual {usual:.0f})")

                  if usual > 0 and (now == 0 or now < 0.5 * usual):
                      print(
                          f"::error::{city}: source {source} reported {now} stations on {complete_utc} "
                          f"(usual {usual:.0f})"
                      )
                      failed = True

          sys.exit(1 if failed else 0)
          PY

      - name: airdata.kz is up and shows recent data
        run: |
          curl -fsS --max-time 30 https://airdata.kz/ -o /dev/null
          curl -fsS --max-time 30 "https://airdata.kz/data/calendar.json?t=$(date +%s)" -o calendar.json
          python3 - <<'PY'
          import json, sys
          from datetime import date

          cal = json.load(open("calendar.json"))
          latest = max(
              date(int(y), int(d[:2]), int(d[3:]))
              for years in cal.values()
              for y, v in years.items()
              for d in v["days"]
          )
          age = (date.today() - latest).days
          print(f"Latest day on airdata.kz: {latest} ({age} days ago)")

          if age > 3:
              print(f"::error::airdata.kz shows data that is {age} days old")
              sys.exit(1)
          PY
